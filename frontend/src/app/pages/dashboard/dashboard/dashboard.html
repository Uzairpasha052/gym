<div class="dashboard">
    
    <!-- Background -->
    <div class="dash_background">
        <div class="dash_overlay"></div>
    </div>

      <!-- Header -->
    <header class="dash_header">

        <div class="dash_logo">
            <img src="images/gym_pic-8.jfif" alt="softronicSys">
        </div>
        
        <div class="dash_userInfo_container">
            <div class="dash_userInfo">
                <span style="color: rgb(23, 189, 5); font-weight: bold; margin-bottom: 5px;">Welcome</span>
                <span> <strong>User Name :</strong> {{userName}} - <strong>{{userRole}}</strong></span>
            </div>
            <div class="dash_icon">
                <span>
                    <iconify-icon icon="mdi:user"></iconify-icon>
                </span>
            </div>
        </div>

    </header>

    <div class="dash_logout_container">
        <div class="dash_logout">
            <span style="color: white;"> | </span>
            <span>
                <!-- <a href="#">Logout</a> -->
                 <button (click)="logOut()">Logout</button>
            </span>
            <span style="color: white;"> | </span>
        </div>
    </div>

    <div class="dash_hero">
        <aside class="sidebar">
            <img src="images/gym_pic-2.jfif" alt="GymKick">
        <!-- <h2>🌟 Favorites</h2> -->
        <!-- ⭐ -->
        </aside>

        <main class="content">

            <div class="title">
                <span>Uzair Ahmed</span>
            </div>

            <div class="menu">
                <div class="menu-item">
                    <button class="circle dark" type="button" (click)="toggleApps()"
                            [attr.aria-expanded]="!hideApp" aria-label="Toggle dashboard shortcuts">
                        <iconify-icon icon="material-symbols:grid-on" class="dark_icon" aria-hidden="true"></iconify-icon>
                    </button>
                </div>

                <div class="menu-item-container">
                    @if (loadingMenu) {
                        <!-- <p class="menu-error">Loading shortcuts…</p> -->
                    } @else if (menuError) {
                        <p class="menu-error">{{ menuError }}</p>
                    } @else {
                        @for (item of parentMenus; track item.id) {
                            <a class="circle light" [class.hide]="hideApp" [routerLink]="item.route" [attr.aria-label]="'Open ' + item.title" [title]="item.title">
                                <iconify-icon [attr.icon]="iconifyName(item.icon)" aria-hidden="true"></iconify-icon>
                                <span class="menu-label">{{ item.title }}</span>
                            </a>
                        }
                    }
                </div>
            </div>
        </main>

    </div>
    <!-- <footer>
        <span>V-2.00.2026</span>
        <!-- <span>Copyright © 2026 softronicSys (Pvt.) Ltd</span>
        <span>Made by UZAIR</span> 
    </footer> -->

</div>
