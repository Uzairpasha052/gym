<div class="dashboard">
    
    <!-- Background -->
    <div class="dash_background">
        <div class="dash_overlay"></div>
    </div>

      <!-- Header -->
    <header class="dash_header">

        <div class="dash_logo">
            <img src="images/gym_pic-8.jfif" alt="softronicSys">
        </div>
        
        <div class="dash_userInfo_container">
            <div class="dash_userInfo">
                <span style="color: rgb(23, 189, 5); font-weight: bold; margin-bottom: 5px;">Welcome</span>
                <span> <strong>User Name :</strong> {{userName}} - <strong>{{userRole}}</strong></span>
                <!-- <span> <strong>Company :</strong> 006 - SoftronicSYS</span> -->
            </div>
            <div class="dash_icon">
                <span>
                    <iconify-icon icon="mdi:user"></iconify-icon>
                </span>
            </div>
        </div>

    </header>

    <div class="dash_logout_container">
        <div class="dash_logout">
            <!-- <span>
                <a href="#">Secret Questions & Answers</a>
            </span>
            <span style="color: white;"> | </span>
            <span>
                <a href="#">Change Password</a>
            </span> -->
            <span style="color: white;"> | </span>
            <span>
                <!-- <a href="#">Logout</a> -->
                 <button (click)="logOut()">Logout</button>
            </span>
            <span style="color: white;"> | </span>
        </div>
    </div>

    <div class="dash_hero">
        <aside class="sidebar">
            <img src="images/gym_pic-2.jfif" alt="GymKick">
        <!-- <h2>🌟 Favorites</h2> -->
        <!-- ⭐ -->
        </aside>

        <main class="content">

            <div class="title">
                <span>Uzair Ahmed</span>
            </div>

            <div class="menu">

                <div class="menu-item">
                    <div class="circle dark" (click)="toggleApps()">
                        <!-- <i class="fa fa-th"></i> -->
                         <iconify-icon icon="material-symbols:grid-on" class="dark_icon"></iconify-icon>
                    </div>
                </div>

                <div class="menu-item-container">

                    <div class="menu-item">
                        <div class="circle light" [class.hide]="hideApp">
                            <button (click)="openHomeScreen($event)">
                                 <iconify-icon class="dashboardImg" icon="material-symbols:fact-check-outline"></iconify-icon>
                            </button>
                        </div>
                    </div>

                    @if (adminservice.isAdmin()) {
                        <div class="menu-item">
                            <div class="circle light" [class.hide]="hideApp">
                                <button (click)="openAdminScreen($event)">
                                    <iconify-icon class="dashboardImg" icon="material-symbols:shield-person-outline"></iconify-icon>
                                </button>
                            </div>
                        </div>

                        <div class="menu-item">
                            <div class="circle light" [class.hide]="hideApp">
                                <button (click)="openCashScreen($event)">
                                    <iconify-icon class="adminImg" icon="material-symbols:payments-outline"></iconify-icon>
                                </button>
                            </div>
                        </div>
                    }

                    <!-- <div class="menu-item">
                        <div class="circle light" [class.hide]="hideApp">
                            <a href="#">
                            <img src="images/ESS_Portal.png" alt="ESS">
                            </a>
                            <!-- <img src="images/ESS_Portal.png"> 
                            <!-- <p>ESS Portal</p> 
                        </div>
                    </div>                 -->

                </div>
            </div>
        </main>

    </div>
    <footer>
        <span>V-2.00.2026</span>
        <!-- <span>Copyright © 2026 softronicSys (Pvt.) Ltd</span> -->
        <span>Made by UZAIR</span> 
    </footer>

</div>
