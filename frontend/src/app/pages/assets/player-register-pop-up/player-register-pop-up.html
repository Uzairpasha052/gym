<div class="overlay" (click)="closePopup()"></div>

<div class="popup">

    <h2>Add Player</h2>

    <form #playerForm="ngForm" (ngSubmit)="register(playerForm)">

        <div class="split">

            <input 
                type="text"
                placeholder="Full Name"
                [(ngModel)]="player.name"
                name="fullName"
                required
            />
        
            <input 
                type="text"
                placeholder="Father Name"
                [(ngModel)]="player.fName"
                name="fatherName"
                required
            />
        
        </div>

        <div class="split">

            <input 
                type="text"
                placeholder="Age"
                [(ngModel)]="player.age"
                name="age"
                required
            />

            <input 
                type="text"
                placeholder="Gender"
                [(ngModel)]="player.gender"
                name="gender"
                required
            />

        </div>

        <div class="split">

            <input 
                type="text"
                placeholder="Contact"
                [(ngModel)]="player.contact"
                name="contact"
                required
            />

            <input 
                type="text"
                placeholder="Fee"
                [(ngModel)]="player.fee"
                name="fee"
                required
            />

        </div>

        <div class="split">

            <input 
                type="text"
                placeholder="History (opt)"
                [(ngModel)]="player.history"
                name="history"
            />

        </div>


        <textarea 
            placeholder="Reason (opt)"
            [(ngModel)]="player.reason"
            name="reason"
        ></textarea>

        

        <!-- <select 
            [(ngModel)]="user.role"
            name="role"
            required>

            <option value="">
                Select Role
            </option>

            <option value="Admin">
                Admin
            </option>

            <option value="Employee">
                Employee
            </option>

            <option value="Hr">
                Hr
            </option>

        </select> -->


        <button type="submit" class="register">
            Register
        </button>

        <button 
            type="button"
            class="cancel"
            (click)="closePopup()">
            Cancel
        </button>

    </form>

    <p class="footer">Create a GYM Player</p>

</div>
