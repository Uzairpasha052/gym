<p-toast position="top-right"></p-toast>

<div class="main_container">
  <div class="hero_section">
    <div class="logo_section">
      <div class="hero_img_1"><img src="images/gym-logo.png" alt="Gym logo"></div>
      <div class="hero_img_3">
        <button routerLink="/dashboard"> <i class="fa-solid fa-arrow-left"></i> Go to Dashboard</button>
        <img src="images/gym_pic-8.jfif" alt="Gym">
      </div>
    </div>

    <div class="header_section">
      <div class="scroll_text"><span>CASH-FLOW PORTAL</span></div>
    </div>

    <div class="cash-container">
      <aside class="sidebar" aria-label="Cash flow navigation">
        @if (loadingMenu) {
          <span class="sidebar-message">Loading navigation…</span>
        } @else if (menuError) {
          <span class="sidebar-message error">{{ menuError }}</span>
        } @else {
          @for (item of cashMenus; track item.id) {
            <button [routerLink]="item.route" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
              <i [class]="item.icon" aria-hidden="true"></i> {{ item.title }}
            </button>
          }
        }
      </aside>

      <main class="content">
        <router-outlet></router-outlet>
      </main>
    </div>
  </div>
</div>
