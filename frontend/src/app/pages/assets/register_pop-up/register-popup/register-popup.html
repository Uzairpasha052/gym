<div class="overlay" (click)="closePopup()"></div>

<div class="popup">

    <h2>Create Account</h2>

    <form #UserForm="ngForm" (ngSubmit)="register(UserForm)">

        <input 
            type="text"
            placeholder="Full Name"
            [(ngModel)]="user.fullName"
            name="fullName"
            required
        />

        <input 
            type="email"
            placeholder="Email"
            [(ngModel)]="user.email"
            name="email"
            required
        />

        <input 
            type="password"
            placeholder="Password"
            [(ngModel)]="user.password"
            name="password"
            required
        />

        <select 
            [(ngModel)]="user.roleId"
            name="roleId"
            required
            [disabled]="rolesLoading || roles.length === 0">

            <option [ngValue]="null">
                Select Role
            </option>

            @for (role of roles; track role.id) {
                <option [ngValue]="role.id">{{ role.name }}</option>
            }

        </select>
        @if (rolesError) { <p class="error">{{ rolesError }}</p> }

        <button type="submit" class="register">
            Register
        </button>

        <button 
            type="button"
            class="cancel"
            (click)="closePopup()">
            Cancel
        </button>

    </form>

    <p class="footer">Create Account for Access Portal</p>

</div>
