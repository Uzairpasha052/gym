<div class="overlay" (click)="closePopup()"></div>

<div class="popup">

    <h2>Create Account</h2>

    <form #UserForm="ngForm" (ngSubmit)="register(UserForm)">

        <input 
            type="text"
            placeholder="Full Name"
            [(ngModel)]="user.fullName"
            name="fullName"
            required
        />

        <input 
            type="email"
            placeholder="Email"
            [(ngModel)]="user.email"
            name="email"
            required
        />

        <input 
            type="password"
            placeholder="Password"
            [(ngModel)]="user.password"
            name="password"
            required
        />

        <select 
            [(ngModel)]="user.roleId"
            name="roleId"
            required
            (change)="loadPlayers()"
            [disabled]="rolesLoading || roles.length === 0">

            <option [ngValue]="null">
                Select Role
            </option>

            @for (role of roles; track role.id) {
                <option [ngValue]="role.id">{{ role.name }}</option>
            }

        </select>
        @if (rolesError) { <p class="error">{{ rolesError }}</p> }

        @if (selectedRoleName.toLowerCase() === 'member') {
            <select [(ngModel)]="user.playerId" name="playerId" required [disabled]="playersLoading || players.length === 0">
                <option [ngValue]="null">{{ playersLoading ? 'Loading players…' : 'Select player profile' }}</option>
                @for (player of players; track player.id) { <option [ngValue]="player.id">{{ player.name }} · {{ player.contact }}</option> }
            </select>
            @if (!playersLoading && players.length === 0) { <p class="error">No active player profiles are available.</p> }
        }

        <button type="submit" class="register">
            Register
        </button>

        <button 
            type="button"
            class="cancel"
            (click)="closePopup()">
            Cancel
        </button>

    </form>

    <p class="footer">Create Account for Access Portal</p>

</div>
