<div class="main_container">
  <div class="hero_section">
    <div class="logo_section">
      <div class="hero_img_1"><img src="images/gym-logo.png" alt="Gym logo"></div>
      <div class="hero_img_3"><img src="images/gym_pic-8.jfif" alt="Gym"></div>
    </div>

    <div class="admin-container">
      <aside class="sidebar" aria-label="Administration navigation">
        <button routerLink="/admin/users" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
          <i class="fa-regular fa-user"></i> Users
        </button>
        <button routerLink="/admin/attendance" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
          <i class="fa-solid fa-clipboard-check"></i> Attendance
        </button>
        <button routerLink="/admin/players" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
          <i class="fa-solid fa-user"></i> Players
        </button>
        <button routerLink="/admin/reports" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
          <i class="fa-solid fa-file-invoice"></i> Reports
        </button>
        <button routerLink="/admin/audit-logs" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
          <i class="fa-solid fa-clipboard-list"></i> Audit Logs
        </button>
        <button routerLink="/admin/configuration" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
          <i class="fa-solid fa-gear"></i> Configuration
        </button>
      </aside>

      <section class="content">
        <router-outlet></router-outlet>
      </section>
    </div>
  </div>
</div>
