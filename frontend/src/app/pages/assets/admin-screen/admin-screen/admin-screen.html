<div class="main_container">
  <div class="hero_section">
   
    <div class="logo_section">
      <div class="hero_img_1"><img src="images/gym-logo.png" alt="Gym logo"></div>
      <div class="hero_img_3">
        <button routerLink="/dashboard"> <i class="fa-solid fa-arrow-left"></i> Go to Dashboard</button>
        <img src="images/gym_pic-8.jfif" alt="Gym">
      </div>
    </div>

    <div class="admin-container">
      <aside class="sidebar" aria-label="Administration navigation">
        @if (loadingMenu) {
          <p class="sidebar-message">Loading navigation…</p>
        } @else if (menuError) {
          <p class="sidebar-message error">{{ menuError }}</p>
        } @else if (menuItems.length === 0) {
          <p class="sidebar-message">No pages are assigned to this role.</p>
        } @else {
          @for (item of menuItems; track item.id) {
            <button [routerLink]="routeFor(item)" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
              <i [class]="item.icon" aria-hidden="true"></i> {{ item.title }}
            </button>
          }
        }
      </aside>

      <section class="content">
        <router-outlet></router-outlet>
      </section>
    </div>
  </div>
</div>
